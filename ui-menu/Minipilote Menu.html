<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minipilote — Menu Power Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #eceaf2;
    color: #2b2733;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100vh; }

  .mp-root {
    --ink-900:#15131c; --ink-700:#3a3543; --ink-500:#67616f; --ink-300:#9c97a3;
    --ink-200:#d9d6df; --ink-100:#ececef; --ink-050:#f6f5f9;
    --rail-w-icons:68px; --rail-w-rail:96px; --rail-w-exp:256px;
    display:flex; height:100vh; overflow:hidden; background:#f3f2f7;
  }

  /* ======================= RAIL ======================= */
  .mp-rail {
    position:relative; flex:0 0 auto; display:flex; flex-direction:column;
    background:#fff; border-right:1px solid var(--ink-100);
    transition: width .18s ease;
    z-index:30;
  }
  .mp-mode-icons { width:var(--rail-w-icons); }
  .mp-mode-rail  { width:var(--rail-w-rail); }
  .mp-mode-expanded { width:var(--rail-w-exp); }

  .mp-rail-top {
    display:flex; align-items:center; gap:8px; padding:12px 10px 10px;
    min-height:60px;
  }
  .mp-mode-expanded .mp-rail-top { padding:14px 14px 10px; }
  .mp-mode-icons .mp-rail-top, .mp-mode-rail .mp-rail-top { flex-direction:column; gap:6px; }

  .mp-brand {
    display:flex; align-items:center; gap:10px; border:0; background:transparent;
    cursor:pointer; padding:0; color:var(--ink-900);
  }
  .mp-brand-mark {
    width:36px; height:36px; border-radius:9px; flex:0 0 auto;
    background:var(--mp-accent); color:var(--mp-on-accent);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; letter-spacing:-.02em;
    box-shadow: 0 2px 6px rgba(21,19,28,.18);
  }
  .mp-brand-word { font-weight:800; font-size:17px; letter-spacing:-.02em; }

  .mp-hamburger {
    width:36px; height:36px; border:0; border-radius:8px; background:transparent;
    color:var(--ink-500); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .mp-hamburger:hover { background:var(--ink-050); color:var(--ink-900); }
  .mp-mode-expanded .mp-rail-top { justify-content:space-between; }

  .mp-rail-scroll {
    flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
    padding:6px 8px 16px; display:flex; flex-direction:column; gap:3px;
  }
  .mp-mode-expanded .mp-rail-scroll { padding:6px 10px 16px; }
  .mp-rail-scroll::-webkit-scrollbar { width:8px; }
  .mp-rail-scroll::-webkit-scrollbar-thumb { background:var(--ink-200); border-radius:8px; }

  /* ---- item base ---- */
  .mp-item {
    position:relative; width:100%; border:0; background:transparent; cursor:pointer;
    color:var(--ink-700); font-family:inherit;
    display:flex; align-items:center; gap:4px;
    border-radius:10px; padding:8px 6px;
    flex-direction:column; text-align:center;
    transition: background .12s ease, color .12s ease;
  }
  .mp-item-tile {
    display:flex; align-items:center; justify-content:center;
    width:40px; height:34px; border-radius:9px; color:inherit;
    transition: background .12s ease, color .12s ease;
  }
  .mp-item-label {
    font-size:11px; font-weight:500; line-height:1.2; color:var(--ink-700);
    max-width:100%;
  }
  .mp-item-kidcue { display:none; }

  .mp-item:hover { background:var(--ink-050); }

  /* expanded mode: horizontal items */
  .mp-mode-expanded .mp-item {
    flex-direction:row; text-align:left; gap:12px; padding:9px 12px;
  }
  .mp-mode-expanded .mp-item-tile { width:24px; height:24px; }
  .mp-mode-expanded .mp-item-label {
    font-size:13.5px; font-weight:600; color:var(--ink-700);
    flex:1 1 auto; display:flex; align-items:center; justify-content:space-between;
    white-space:normal;
  }
  .mp-acc-arrow { color:var(--ink-300); display:flex; }

  /* ============ VARIANT 1 — FIDÈLE (white card selected) ============ */
  .mp-root[data-variant="fidele"] .mp-rail { background:#faf9fb; }
  .mp-root[data-variant="fidele"] .mp-item.is-active {
    background:#fff; box-shadow: 0 1px 3px rgba(21,19,28,.10), 0 0 0 1px rgba(21,19,28,.04);
  }
  .mp-root[data-variant="fidele"] .mp-item.is-active .mp-item-tile { color:var(--mp-accent); }
  .mp-root[data-variant="fidele"] .mp-item.is-active .mp-item-label { color:var(--ink-900); font-weight:600; }
  .mp-root[data-variant="fidele"] .mp-item.is-active::before {
    content:""; position:absolute; left:-8px; top:50%; transform:translateY(-50%);
    width:3px; height:22px; border-radius:3px; background:var(--mp-accent);
  }
  .mp-root[data-variant="fidele"].mp-has-exp {}

  /* ============ VARIANT 2 — ACCENT (tint pill + bar) ============ */
  .mp-root[data-variant="accent"] .mp-item.is-active {
    background:var(--mp-accent-tint);
  }
  .mp-root[data-variant="accent"] .mp-item.is-active .mp-item-tile { color:var(--mp-accent); }
  .mp-root[data-variant="accent"] .mp-item.is-active .mp-item-label { color:var(--mp-accent); font-weight:700; }
  .mp-root[data-variant="accent"] .mp-item.is-active::before {
    content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:26px; border-radius:0 3px 3px 0; background:var(--mp-accent);
  }
  .mp-root[data-variant="accent"] .mp-mode-expanded .mp-item.is-active::before { height:34px; }

  /* ============ VARIANT 3 — TUILE (solid filled) ============ */
  .mp-root[data-variant="tuile"] .mp-rail { background:var(--mp-accent-tint); }
  .mp-root[data-variant="tuile"] .mp-item:hover { background:rgba(0,0,0,.05); }
  .mp-root[data-variant="tuile"] .mp-item.is-active .mp-item-tile {
    background:var(--mp-accent); color:var(--mp-on-accent);
    box-shadow: 0 3px 8px -2px rgba(21,19,28,.35);
  }
  .mp-root[data-variant="tuile"] .mp-item.is-active .mp-item-label { color:var(--ink-900); font-weight:700; }
  .mp-root[data-variant="tuile"] .mp-mode-expanded .mp-item.is-active {
    background:var(--mp-accent); 
  }
  .mp-root[data-variant="tuile"] .mp-mode-expanded .mp-item.is-active .mp-item-tile {
    background:transparent; color:var(--mp-on-accent); box-shadow:none;
  }
  .mp-root[data-variant="tuile"] .mp-mode-expanded .mp-item.is-active .mp-item-label { color:var(--mp-on-accent); }
  .mp-root[data-variant="tuile"] .mp-mode-expanded .mp-item.is-active .mp-acc-arrow { color:var(--mp-on-accent); }

  /* ---- accordion (expanded) sub-list ---- */
  .mp-acc-list { list-style:none; margin:2px 0 4px; padding:0 0 0 12px; display:flex; flex-direction:column; }
  .mp-acc-list li a {
    display:block; text-decoration:none; color:var(--ink-500);
    font-size:12.5px; font-weight:500; padding:7px 12px 7px 24px; border-radius:8px;
    border-left:2px solid var(--ink-100); margin-left:12px;
  }
  .mp-acc-list li a:hover { color:var(--ink-900); background:var(--ink-050); }
  .mp-acc-list li a.is-active { color:var(--mp-accent); font-weight:700; border-left-color:var(--mp-accent); }

  /* ---- tooltips (icons / rail mode, items without kids) ---- */
  .mp-mode-icons .mp-item::after,
  .mp-mode-icons .mp-item.has-kids::after,
  .mp-item::after {
    content:attr(data-tip); position:absolute; left:calc(100% + 12px); top:50%;
    transform:translateY(-50%) scale(.96); transform-origin:left center;
    background:var(--ink-900); color:#fff; font-size:12px; font-weight:500; white-space:nowrap;
    padding:6px 10px; border-radius:7px; pointer-events:none; opacity:0;
    transition:opacity .12s ease, transform .12s ease; z-index:50;
    box-shadow:0 6px 20px -6px rgba(0,0,0,.4);
  }
  .mp-mode-icons .mp-item:hover::after { opacity:1; transform:translateY(-50%) scale(1); }
  /* In rail/expanded mode, only childless items show tooltip and only in icons mode -> disable elsewhere */
  .mp-mode-rail .mp-item::after, .mp-mode-expanded .mp-item::after { display:none; }
  /* kid items in icons mode: show chevron cue */
  .mp-mode-icons .mp-item.has-kids .mp-item-kidcue {
    display:block; position:absolute; right:4px; top:50%; transform:translateY(-50%); color:var(--ink-300);
  }

  /* ======================= FLYOUT ======================= */
  .mp-flyout {
    position:absolute; left:100%; margin-left:6px;
    min-width:212px; background:#fff; border:1px solid var(--ink-100);
    border-radius:12px; box-shadow:0 16px 44px -12px rgba(21,19,28,.32), 0 2px 8px rgba(21,19,28,.08);
    padding:10px; z-index:40; animation:flyIn .14s ease;
  }
  @keyframes flyIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:none; } }
  .mp-flyout-title {
    font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-300); padding:4px 10px 8px;
  }
  .mp-flyout-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; }
  .mp-flyout-list a {
    display:block; text-decoration:none; color:var(--ink-700);
    font-size:13px; font-weight:500; padding:8px 10px; border-radius:8px;
  }
  .mp-flyout-list a:hover { background:var(--ink-050); color:var(--ink-900); }
  .mp-flyout-list a.is-active { background:var(--mp-accent-tint); color:var(--mp-accent); font-weight:700; }

  /* ======================= MAIN ======================= */
  .mp-main { flex:1 1 auto; display:flex; flex-direction:column; min-width:0; background:#f3f2f7; }

  .mp-topbar {
    flex:0 0 auto; height:56px; display:flex; align-items:center; gap:14px;
    padding:0 18px; background:#fff; border-bottom:1px solid var(--ink-100);
  }
  .mp-top-btn {
    width:38px; height:38px; border:0; border-radius:8px; background:transparent; cursor:pointer;
    color:var(--ink-500); display:flex; align-items:center; justify-content:center; position:relative;
  }
  .mp-top-btn:hover { background:var(--ink-050); color:var(--ink-900); }
  .mp-top-title { display:flex; align-items:center; gap:10px; }
  .mp-top-product { font-weight:800; font-size:15px; letter-spacing:-.01em; color:var(--ink-900); }
  .mp-top-sep { color:var(--ink-200); }
  .mp-top-context { font-size:13px; color:var(--ink-500); }
  .mp-top-search {
    margin-left:18px; flex:1 1 auto; max-width:460px; display:flex; align-items:center; gap:8px;
    background:var(--ink-050); border:1px solid transparent; border-radius:9px; padding:0 12px; height:38px;
    color:var(--ink-300);
  }
  .mp-top-search:focus-within { border-color:var(--mp-accent); background:#fff; }
  .mp-top-search input { border:0; background:transparent; outline:none; flex:1; font:inherit; font-size:13px; color:var(--ink-900); }
  .mp-top-right { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .mp-dot { position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:#e0533d; border:2px solid #fff; }
  .mp-avatar {
    width:36px; height:36px; border-radius:50%; border:0; cursor:pointer; margin-left:6px;
    background:var(--mp-accent); color:var(--mp-on-accent); font-weight:700; font-size:13px;
  }

  .mp-content { flex:1 1 auto; overflow-y:auto; padding:28px 32px 48px; }

  /* ---- page ---- */
  .mp-page { max-width:1180px; margin:0 auto; }
  .mp-page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; }
  .mp-crumb { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-300); margin-bottom:8px; }
  .mp-h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--ink-900); }
  .mp-sub { margin:6px 0 0; font-size:13.5px; color:var(--ink-500); }
  .mp-head-actions { display:flex; gap:10px; flex:0 0 auto; }

  .mp-btn {
    border:0; border-radius:9px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    padding:9px 15px; display:inline-flex; align-items:center; gap:7px;
  }
  .mp-btn-primary { background:var(--mp-accent); color:var(--mp-on-accent); }
  .mp-btn-primary:hover { filter:brightness(1.08); }
  .mp-btn-ghost { background:#fff; border:1px solid var(--ink-200); color:var(--ink-700); }
  .mp-btn-ghost:hover { border-color:var(--ink-300); }

  .mp-card {
    background:#fff; border:1px solid var(--ink-100); border-radius:14px; padding:20px;
    box-shadow:0 1px 2px rgba(21,19,28,.03);
  }
  .mp-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .mp-h2 { margin:0; font-size:15px; font-weight:700; color:var(--ink-900); }
  .mp-link { font-size:12.5px; font-weight:600; color:var(--mp-accent); text-decoration:none; }
  .mp-link:hover { text-decoration:underline; }

  .mp-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
  .mp-kpi { padding:16px 18px; }
  .mp-kpi-label { font-size:12px; font-weight:500; color:var(--ink-500); }
  .mp-kpi-value { font-size:30px; font-weight:800; letter-spacing:-.03em; color:var(--ink-900); margin:6px 0 2px; }
  .mp-kpi-sub { font-size:11.5px; font-weight:600; color:var(--ink-300); }
  .mp-kpi-sub.up { color:#1f8a5b; }
  .mp-kpi-sub.down { color:#c9622d; }

  .mp-grid2 { display:grid; grid-template-columns:1.15fr 1fr; gap:16px; }

  .mp-sessions { display:flex; flex-direction:column; }
  .mp-session { display:flex; align-items:center; gap:14px; padding:11px 4px; border-top:1px solid var(--ink-100); }
  .mp-session:first-child { border-top:0; }
  .mp-session-time { width:50px; flex:0 0 auto; text-align:right; }
  .mp-session-time b { display:block; font-size:14px; font-weight:700; color:var(--ink-900); }
  .mp-session-time span { font-size:11px; color:var(--ink-300); }
  .mp-session-bar { width:3px; align-self:stretch; border-radius:3px; background:var(--mp-accent); opacity:.8; }
  .mp-session-main { flex:1 1 auto; min-width:0; }
  .mp-session-title { font-size:13.5px; font-weight:600; color:var(--ink-900); }
  .mp-session-meta { font-size:12px; color:var(--ink-500); }

  .mp-table { width:100%; border-collapse:collapse; font-size:13px; }
  .mp-table th { text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-300); padding:0 10px 10px; border-bottom:1px solid var(--ink-100); }
  .mp-table td { padding:11px 10px; border-bottom:1px solid var(--ink-050); color:var(--ink-700); vertical-align:middle; }
  .mp-table tr:last-child td { border-bottom:0; }
  .mp-mono { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-500); }
  .mp-num { font-weight:700; color:var(--ink-900); }
  .mp-td-sub { font-size:11px; color:var(--ink-300); margin-top:2px; }

  .mp-pill { display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .mp-pill-ok { background:#e3f4ec; color:#1f7a52; }
  .mp-pill-info { background:#e6eefb; color:#2a5fae; }
  .mp-pill-warn { background:#fdf0db; color:#a96b16; }

  .mp-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .mp-search-field { display:flex; align-items:center; gap:8px; background:var(--ink-050); border-radius:9px; padding:0 12px; height:36px; flex:0 0 260px; color:var(--ink-300); }
  .mp-search-field input { border:0; background:transparent; outline:none; font:inherit; font-size:13px; color:var(--ink-900); flex:1; }
  .mp-chip { font-size:12.5px; font-weight:600; color:var(--ink-500); padding:7px 12px; border-radius:8px; border:1px solid var(--ink-200); cursor:pointer; }
  .mp-chip:hover { border-color:var(--ink-300); color:var(--ink-900); }

  .mp-skel { display:inline-block; height:10px; border-radius:5px; background:linear-gradient(90deg,var(--ink-100),var(--ink-050)); }
  .mp-skel-strong { background:var(--ink-200); }
  .mp-empty-note { margin-top:16px; font-size:12px; color:var(--ink-300); text-align:center; }

  @media (max-width:1080px) {
    .mp-grid2 { grid-template-columns:1fr; }
    .mp-kpis { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="icons.js"></script>
  <script src="nav-data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="content.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
